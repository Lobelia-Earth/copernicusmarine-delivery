name: Release

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_BOT_RW_TOKEN }}

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: publish

      - name: Build and publish Pypi package
        run: pixi run -e publish publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Set VERSION environment variable
        id: set-version
        run: echo "VERSION=$(pixi run -e publish version)" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag v${{ steps.set-version.outputs.VERSION }}
          git push origin --tags

      - name: Create Github release
        run: gh release create v${{ steps.set-version.outputs.VERSION }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_RW_TOKEN }}