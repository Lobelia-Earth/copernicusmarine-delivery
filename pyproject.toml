[project]
name = "pusher"
version = "0.1.0"
description = "Marine producer toolbox pusher"
authors = [{ name = "lobelia", email = "support@lobelia.earth" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.0,<9",
    "obstore>=0.10.0,<1",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "tqdm>=4,<5", "requests",
]

[project.scripts]
pusher = "pusher.command_line_interface:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pusher", "delivery_common"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
pusher = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
pyright = "*"
syrupy = ">=5.1.0,<6"
freezegun = ">=1.5.5,<2"
boto3 = ">=1.43.22,<2"
requests = ">=2.34.2,<3"
ty = ">=0.0.44,<0.0.45"

[tool.pixi.feature.dev.tasks]
format = "ruff format .; ruff check --fix ."
format-check = "ruff format --check .; ruff check ."
type-check = "ty check ."
test-local = "pytest --snapshot-update"
test = "pytest"
test-fast = "pytest -m \"not slow\""
setup-local = "python tests/resources/setup.py"
list-local = "python tests/resources/setup.py --list"
clean-local = "python tests/resources/setup.py --clean"

[tool.pixi.feature.dev.activation.env]
ALLOW_HTTP = "true"
MDL_METADATA_BUCKET = "mdl-metadata-dta"
MDL_METADATA_ENDPOINT = "http://localhost:4566"
OPDV_S3_ENDPOINT = "http://localhost:4566"
COPERNICUSMARINE_USERNAME = "test"
COPERNICUSMARINE_PASSWORD = "test"
INGESTION_SERVICE_URL = "http://localhost:8005"
PYTHON_LOG_DEBUG = "true"

[tool.ruff.lint]
select = ["F401", "I"]
fixable = ["F401", "I"]

[dependency-groups]
dev = ["httpx>=0.28.1,<0.29"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pytest]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]